id: cli-session-timeout-manager
title: "CLI-Driven Robust Session Timeout and Refresh Logic with Proactive & Reactive Handling"
difficulty: ultra-hard
estimated_time: 250
tags: [cli, session-management, authentication, token-refresh, timeout, api-client]
description: |
  Implement a CLI tool that interacts with a mock API requiring authenticated sessions.
  The CLI must manage session tokens (access and refresh tokens), proactively refresh them
  before expiry, and handle session expiry reactively by attempting refresh or prompting
  for re-authentication.

  Key features and complexities:
  1.  **Session State Storage:**
      - Securely store the access token, refresh token, and their respective expiry timestamps.
      - For this task, use a local file (e.g., `~/.config/my_cli_app/session.json`) with appropriate
        permissions (600). Integration with a full keychain (like Task 2) is conceptual but
        not a direct implementation requirement here, focus on the logic.
  2.  **Authentication Flow (`login` command):**
      - Accepts username/password (mocked credentials).
      - Calls a `mock_auth_api.sh` to authenticate.
      - On success, mock API returns an access token, a refresh token, and their expiry times (e.g., access token valid for 60s, refresh for 5min).
      - Stores these tokens and expiry times.
  3.  **Protected Resource Access (`call-api` command):**
      - Before making a call to `mock_protected_resource_api.sh`:
          - **Proactive Refresh Check:** If the access token is within a configurable "imminent expiry" window (e.g., <15 seconds remaining), attempt to refresh it using the refresh token *before* making the API call.
          - If no valid session or refresh fails, trigger re-authentication.
      - Makes the API call with the (potentially refreshed) access token.
      - **Reactive Refresh:** If the protected API call fails with an "expired token" error (e.g., mock API returns HTTP 401 with a specific error code):
          - Attempt to refresh the access token using the refresh token.
          - If refresh is successful, retry the original API call once with the new access token.
          - If refresh fails, trigger re-authentication.
  4.  **Token Refresh Logic (`refresh-token` internal mechanism):**
      - Calls `mock_auth_api.sh` with the refresh token.
      - Mock API validates the refresh token and, if valid, issues a new access token (and potentially a new refresh token) with new expiry times.
      - Updates the stored session state with the new tokens/expiries.
      - Handles refresh token expiry or invalidation (mock API can simulate this).
  5.  **Re-authentication Prompt:**
      - If a session is invalid (no tokens, expired refresh token, refresh fails), the CLI should
        prompt the user to log in again (simulated by indicating re-login is needed and clearing stored session).
        Actual interactive password prompt is optional; focusing on the logic flow.
  6.  **Logout (`logout` command):**
      - Clears stored session tokens.
      - Optionally, call a mock API endpoint to invalidate the session/refresh token on the server side (if mock API supports it).
  7.  **Configuration:**
      - Imminent expiry window for proactive refresh (e.g., seconds before actual expiry).
      - Mock API endpoints.
  8.  **Mock APIs:**
      - `mock_auth_api.sh`: Handles `/login` (user/pass -> tokens), `/refresh` (refresh_token -> new_access_token/new_refresh_token). Simulates token expiry.
      - `mock_protected_resource_api.sh`: Requires a valid access token. Returns 401 for invalid/expired tokens.

success_criteria:
  - CLI can successfully log in via `mock_auth_api.sh` and store session tokens.
  - Proactive token refresh occurs if access token is nearing expiry before a `call-api` attempt.
  - Reactive token refresh occurs if `call-api` receives an "expired token" response, followed by a successful retry of the API call.
  - If refresh token is expired or refresh fails, CLI correctly triggers a re-authentication flow (simulated).
  - `logout` command clears local session and optionally calls a server-side invalidation.
  - Session state (tokens, expiries) is persisted locally (e.g., in a file with 600 permissions).
  - All tests pass with >90% coverage, verifying:
      - Login and initial token storage.
      - Proactive refresh scenarios.
      - Reactive refresh scenarios.
      - Handling of expired refresh tokens.
      - Re-authentication prompts/logic.
      - Logout functionality.
  - Mock APIs correctly simulate token issuance, validation, expiry, and refresh behavior.
  - CLI provides clear feedback on session status, refresh attempts, and authentication requirements.
